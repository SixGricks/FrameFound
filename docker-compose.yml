# FrameFound — base stack (CPU processing).
# GPU:    docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# DDNS:   docker compose --profile ddns up -d
# Tunnel: docker compose --profile tunnel up -d
#
# Security posture:
# - Only Caddy publishes host ports. Postgres/Redis/api/workers live on an
#   internal network and are never exposed.
# - Original media is mounted read-only everywhere (:ro).
# - Containers run as non-root (see Dockerfiles) with no added capabilities.

name: framefound

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${FRAMEFOUND_HTTP_PORT:-8080}:80"
      # 443 published only when FRAMEFOUND_DOMAIN is set; see docs/remote-access.md
      - "443:443"
    environment:
      # ':-' also covers set-but-empty values from .env — Caddy's own
      # placeholder defaults only handle fully unset variables.
      FRAMEFOUND_DOMAIN: ${FRAMEFOUND_DOMAIN:-framefound.internal}
      FRAMEFOUND_ACME_EMAIL: ${FRAMEFOUND_ACME_EMAIL:-internal}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, internal]
    depends_on: [web, api]

  web:
    build: apps/web
    image: ghcr.io/sixgricks/framefound-web:dev
    restart: unless-stopped
    environment:
      # Server-side calls go container-to-container; browser calls go through Caddy.
      API_INTERNAL_URL: http://api:8000
    networks: [internal]
    depends_on: [api]

  api:
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M
    # Migrations run before serving; a schema mismatch fails startup loudly.
    command:
      [
        "bash",
        "-c",
        "alembic upgrade head && exec uvicorn framefound.main:app --host 0.0.0.0 --port 8000",
      ]
    env_file: .env
    environment:
      # Inside containers the media bind always lands at /media;
      # FRAMEFOUND_MEDIA_ROOT in .env is the HOST path for the bind source.
      FRAMEFOUND_MEDIA_ROOT: /media
    volumes:
      - ${FRAMEFOUND_DATA_STORE:-framefound-data}:/data                      # derived files: thumbs, proxies, transcripts
      - framefound-models:/models                  # sky segmentation + CLIP text caches (develop editor)
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/media:ro,rslave
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/cache:rslave
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    # Fast + bulk lanes: visuals (thumbnails/posters) round-robins with
    # metadata so user-visible work is never starved by a bulk sweep.
    # "default" drains jobs queued before the queue rename.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3.0"
          # Was 1000M against 5.9 GB installed, when every limit here was carved
          # out of every other. With 58 GB there is no longer a trade to make.
          memory: 4G
    command: ["celery", "-A", "framefound.worker", "worker", "-Q", "visuals,metadata,default", "--concurrency=3"]
    env_file: .env
    environment:
      # Inside containers the media bind always lands at /media;
      # FRAMEFOUND_MEDIA_ROOT in .env is the HOST path for the bind source.
      FRAMEFOUND_MEDIA_ROOT: /media
    volumes:
      - ${FRAMEFOUND_DATA_STORE:-framefound-data}:/data
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/media:ro,rslave
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/cache:rslave
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker-media:
    # Also takes `frames`: sampling is FFmpeg reading video off the share,
    # which is the same shape as a proxy transcode and nothing like the
    # 300 ms embedding work on `vision`.
    # Heavy lane: proxy transcodes only, isolated so a long FFmpeg run
    # never blocks thumbnails or metadata.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Raised to 6 after measurement: with three samplers running, this
          # container sat pegged at 4.00 cores while the host was a third idle
          # and iowait was near zero. Frames is decode-bound, not share-bound.
          cpus: "6.0"
          # Frames is the long backlog. Concurrency buys more here than
          # anywhere else — and the "5.2 MB/s share" that shaped this file
          # turned out to be a single-stream figure: three parallel readers
          # pull 15 MB/s from the same NAS.
          memory: 8G
    command: ["celery", "-A", "framefound.worker", "worker", "-Q", "media,frames", "--concurrency=3"]
    env_file: .env
    environment:
      FRAMEFOUND_MEDIA_ROOT: /media
    volumes:
      - ${FRAMEFOUND_DATA_STORE:-framefound-data}:/data
      - framefound-models:/models                  # sky segmentation runs in listing exports
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/media:ro,rslave
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/cache:rslave
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker-ai:
    # Transcription only. It used to consume `vision` as well, and that was a
    # mistake of exactly the kind the queue separation exists to prevent:
    # a transcription runs for minutes, an embedding for ~300 ms, and at
    # concurrency 1 the fast work sat behind the slow work. Found in
    # deployment with 6,277 vision jobs queued behind a Whisper backlog and
    # the UI looking stalled.
    # docker-compose.gpu.yml overlays GPU access onto this service.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3.0"
          # Holds the Whisper model and its audio buffers. Concurrency stays
          # at one: two models resident is the profile that got this killed,
          # and RAM has removed the reason to run it close to the edge.
          memory: 6G
    command: ["celery", "-A", "framefound.worker", "worker", "-Q", "transcribe", "--concurrency=1"]
    env_file: .env
    environment:
      # Inside containers the media bind always lands at /media;
      # FRAMEFOUND_MEDIA_ROOT in .env is the HOST path for the bind source.
      FRAMEFOUND_MEDIA_ROOT: /media
    volumes:
      - ${FRAMEFOUND_DATA_STORE:-framefound-data}:/data
      - framefound-models:/models                  # downloaded model weights cache
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/media:ro,rslave
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/cache:rslave
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  mounter:
    # The ONLY container with CAP_SYS_ADMIN. It mounts network shares on
    # request and does nothing else — see docs/adr/0018-mount-helper.md.
    #
    # Enable with:  docker compose --profile storage up -d
    # It stays off by default so an install that never adds a drive from the
    # UI never runs a privileged container at all.
    profiles: ["storage"]
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    command:
      ["uvicorn", "framefound.storage.mounter:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      # No compose-level default on purpose: the helper refuses to start
      # without a token, so an empty value fails closed rather than running
      # a privileged container that accepts anything reaching it.
      FRAMEFOUND_MOUNTER_TOKEN: ${FRAMEFOUND_MOUNTER_TOKEN:-}
    # Root because mount(8) requires it; the capability set is otherwise
    # trimmed to exactly what mounting a network filesystem needs.
    user: root
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    security_opt: ["apparmor:unconfined"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    volumes:
      # rshared so a mount made in here propagates back to the host and into
      # every other container. Without this the mount would exist only in this
      # container's namespace and nothing else would see it.
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/mnt/media:rshared
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/mnt/cache:rshared
    # No published ports: reachable only from the internal compose network.
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-vision:
    # Frame sampling and CLIP embeddings. Separate from worker-ai so a long
    # transcription cannot hold up thousands of sub-second embeddings.
    # Lighter than worker-ai: ONNX CLIP is ~600 MB resident and there is no
    # Whisper model here.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3.0"
          # Holds three ONNX sessions, not one: CLIP vision + text (~350 MB of
          # weights) and the two face models (~183 MB). 900M killed it on the
          # first face detection, and 1200M had to be paid for by trimming
          # `worker`. Two concurrent workers means up to six sessions resident.
          memory: 6G
    command: ["celery", "-A", "framefound.worker", "worker", "-Q", "vision", "--concurrency=2"]
    env_file: .env
    environment:
      FRAMEFOUND_MEDIA_ROOT: /media
    volumes:
      - ${FRAMEFOUND_DATA_STORE:-framefound-data}:/data
      - framefound-models:/models
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/media:ro,rslave
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/cache:rslave
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scanner:
    # Filesystem watcher + periodic reconciliation scans.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    command: ["python", "-m", "framefound.scanner"]
    env_file: .env
    environment:
      # Inside containers the media bind always lands at /media;
      # FRAMEFOUND_MEDIA_ROOT in .env is the HOST path for the bind source.
      FRAMEFOUND_MEDIA_ROOT: /media
    volumes:
      - ${FRAMEFOUND_DATA_STORE:-framefound-data}:/data
      - ${FRAMEFOUND_MEDIA_ROOT:-/mnt/media}:/media:ro,rslave
      - ${FRAMEFOUND_CACHE_ROOT:-/mnt/cache}:/cache:rslave
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    # Celery beat: reconciliation scans, retention cleanup, DDNS checks.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    # -s: beat's state file must land somewhere the non-root user can write.
    command: ["celery", "-A", "framefound.worker", "beat", "-s", "/tmp/celerybeat-schedule"]
    env_file: .env
    networks: [internal]
    depends_on:
      redis: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
    # Defaults assume a shared box: 128MB of shared_buffers and a 4GB guess
    # at the OS cache. Search is pgvector HNSW, which is random-read bound,
    # and the measured disk does ~320 IOPS at 50 ms — so every page served
    # from memory rather than that disk is the biggest win available here.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "max_parallel_workers_per_gather=4"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Valkey: BSD-3-licensed, protocol-compatible Redis fork (ADR-0016).
    # Service keeps the name "redis" so REDIS_HOST and client code stay unchanged.
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "1536mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ddns:
    # Dynamic-DNS sidecar. Idle until remote access is configured in the UI,
    # so it is safe to leave running; it costs nothing when unused.
    build: apps/server
    image: ghcr.io/sixgricks/framefound-server:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 250M
    command: ["python", "-m", "framefound.ddns"]
    env_file: .env
    networks: [internal, edge]  # needs outbound access to the DNS provider
    depends_on:
      postgres: { condition: service_healthy }

  tailscale:
    # Optional. Most installs run Tailscale on the host instead, which is
    # simpler and survives the stack being down — see docs/remote-access.md.
    # This sidecar exists for hosts where installing it is awkward.
    #   docker compose --profile tailnet up -d
    profiles: [tailnet]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${FRAMEFOUND_TAILNET_NAME:-framefound}
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking avoids needing /dev/net/tun and NET_ADMIN on the
      # host; the trade is slightly lower throughput, which does not matter
      # for a UI and is bypassed anyway when serving media over the LAN.
      TS_USERSPACE: "true"
      # Publish the stack to the tailnet, so nothing else needs exposing.
      TS_EXTRA_ARGS: --advertise-tags=tag:framefound
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./infrastructure/tailscale:/config:ro
    networks: [edge, internal]

  cloudflared:
    # Optional Cloudflare Tunnel. Enable with: --profile tunnel
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    networks: [edge]

networks:
  edge:      # touches the outside world (Caddy, tunnel)
  internal:  # app <-> data plane; no published ports

volumes:
  tailscale-state:
  framefound-data:
  framefound-models:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
