name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/server }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,db,queue,scanner,media]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy framefound
      - run: pytest -q
      - name: Migration smoke test (up + down against SQLite)
        run: |
          FRAMEFOUND_DATABASE_URL=sqlite+aiosqlite:///ci-migrate.db alembic upgrade head
          FRAMEFOUND_DATABASE_URL=sqlite+aiosqlite:///ci-migrate.db alembic downgrade base
      - name: License report (informational)
        run: |
          pip install pip-licenses
          pip-licenses --summary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: License report (informational)
        # Informational, not gating. A copyleft dependency creeping into the
        # web bundle is a licensing decision for a human, not a build failure.
        run: npx --yes license-checker@25 --production --summary

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q

  docker-build:
    # Both images are built and scanned on every push. GHCR publishing on tags
    # lives in release.yml, which reuses this cache.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.image }}
          push: false
          load: true
          tags: framefound-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy vulnerability scan (gating)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: framefound-${{ matrix.image }}:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy report (HIGH, informational)
        # Non-gating: HIGH findings with no upstream fix would otherwise block
        # every build on someone else's release schedule. Visible in the log so
        # they get triaged rather than silently accumulating.
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: framefound-${{ matrix.image }}:ci
          severity: HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: framefound-${{ matrix.image }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 30

  secrets-scan:
    # Plain gitleaks container: gitleaks-action requires a license for org repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --log-opts="--all" --redact --exit-code 1
