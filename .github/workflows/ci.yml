name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,db,queue]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy framefound
      - run: pytest -q
      - name: Migration smoke test (up + down against SQLite)
        run: |
          FRAMEFOUND_DATABASE_URL=sqlite+aiosqlite:///ci-migrate.db alembic upgrade head
          FRAMEFOUND_DATABASE_URL=sqlite+aiosqlite:///ci-migrate.db alembic downgrade base
      - name: License report (informational)
        run: |
          pip install pip-licenses
          pip-licenses --summary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install   # TODO(m1): npm ci once package-lock.json is committed
      - run: npm run lint
      - run: npm run typecheck

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
      - run: docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: false
          load: true
          tags: framefound-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: framefound-server:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # TODO(m6): build web image here too once the frontend has real content.
      # GHCR publishing on tags lives in release.yml.

  secrets-scan:
    # Plain gitleaks container: gitleaks-action requires a license for org repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --log-opts="--all" --redact --exit-code 1
