name: Release

# Publishes versioned images + a coordinated manifest when a v* tag is pushed.
# Never publishes `latest` alone — deployments pin versions (brief §15.2).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          push: true
          tags: |
            ghcr.io/sixgricks/framefound-server:${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/sixgricks/framefound-web:${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Release manifest
        run: |
          cat > release-manifest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "images": {
              "server": "ghcr.io/sixgricks/framefound-server:${{ steps.version.outputs.version }}",
              "web": "ghcr.io/sixgricks/framefound-web:${{ steps.version.outputs.version }}"
            },
            "commit": "${{ github.sha }}"
          }
          EOF
          sha256sum release-manifest.json > release-manifest.json.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-manifest.json
            release-manifest.json.sha256
