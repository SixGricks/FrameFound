name: Release

# Publishes versioned images + a coordinated manifest when a v* tag is pushed.
# Never publishes `latest` alone — deployments pin versions (brief §15.2).
#
# Images carry an SBOM and a provenance attestation, and the manifest records
# immutable digests alongside the tags: a tag can be moved, a digest cannot.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [server, web]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.image }}
          push: false
          load: true
          tags: framefound-${{ matrix.image }}:release
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Trivy gate before publishing
        # A tagged release is what people actually deploy. Scan before the
        # image can be pulled, not after.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: framefound-${{ matrix.image }}:release
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.image }} image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.image }}
          push: true
          tags: ghcr.io/sixgricks/framefound-${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/sixgricks/framefound-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Export SBOM for the release
        uses: anchore/sbom-action@v0
        with:
          image: framefound-${{ matrix.image }}:release
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Record digest
        run: echo "${{ steps.push.outputs.digest }}" > digest-${{ matrix.image }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.image }}
          path: |
            sbom-${{ matrix.image }}.spdx.json
            digest-${{ matrix.image }}.txt

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Release manifest
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          server_digest="$(cat digest-server.txt)"
          web_digest="$(cat digest-web.txt)"
          cat > release-manifest.json <<EOF
          {
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "images": {
              "server": {
                "tag": "ghcr.io/sixgricks/framefound-server:${VERSION}",
                "digest": "ghcr.io/sixgricks/framefound-server@${server_digest}"
              },
              "web": {
                "tag": "ghcr.io/sixgricks/framefound-web:${VERSION}",
                "digest": "ghcr.io/sixgricks/framefound-web@${web_digest}"
              }
            },
            "sbom": ["sbom-server.spdx.json", "sbom-web.spdx.json"]
          }
          EOF
          sha256sum release-manifest.json sbom-*.spdx.json > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-manifest.json
            sbom-server.spdx.json
            sbom-web.spdx.json
            SHA256SUMS
