[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "framefound"
version = "0.1.0.dev0"
description = "Self-hosted AI media catalog and search platform"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",  # seals TOTP seeds and DNS tokens at rest
    "pyotp>=2.9",
    "httpx>=0.27",  # DDNS provider calls
]

[project.optional-dependencies]
# Kept separate so CI and the API container stay slim until each milestone
# actually needs the dependency. TODO(m2): scanner. TODO(m3): media. TODO(m4/m5): ai.
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13", "pgvector>=0.3"]
queue = ["celery[redis]>=5.4", "redis>=5.0"]
scanner = ["watchdog>=4.0", "blake3>=0.4"]
# numpy sits with media, not ai: location inference is core catalogue
# behaviour and must run (and be tested) without the heavy ONNX/Whisper
# stack installed.
media = ["pillow>=10.4", "numpy>=1.26"]
ai = ["faster-whisper>=1.0", "onnxruntime>=1.19"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["framefound"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]  # S = bandit security rules
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.per-file-ignores]
# Test fixtures use throwaway passwords/tokens by design.
"tests/*" = ["S105", "S106"]
# These tests parse XML this codebase just generated, in-process. The
# untrusted-input concern S314 exists for does not apply.
"tests/test_fcp7.py" = ["S105", "S106", "S314"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorator is untyped; confined to these modules.
module = [
    "framefound.worker",
    "framefound.processing.tasks",
    "framefound.processing.tag_tasks",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Optional extras. CI type-checks against the core install, so anything only
# present with [scanner]/[media]/[ai] is resolved leniently.
module = [
    "watchdog", "watchdog.*", "blake3",
    "faster_whisper", "faster_whisper.*",
    "onnxruntime", "onnxruntime.*",
    "huggingface_hub", "tokenizers", "pgvector.*",
    "numpy", "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
